# Local development and tests. The Docker image does not use this file: it adds
# timestral to a base image that already has CUDA PyTorch (see Dockerfile).
[project]
name = "timestral-abel"
version = "0.1.0"
description = "HTTP forecasting service for Mistral AI's Timestral models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "timestral",
  "torch>=2.4",
  "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned to the same commit the Dockerfile installs.
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
# CPU wheels for local development; the Docker image uses its base image's CUDA build.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
